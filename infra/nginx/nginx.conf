worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─── logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── performance ────────────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ─── upstream pools ─────────────────────────────────────────────────────────
    upstream auth_service {
        server auth-service:8081;
        keepalive 16;
    }

    upstream product_service {
        server product-service:8082;
        keepalive 16;
    }

    upstream order_service {
        server order-service:8083;
        keepalive 16;
    }

    upstream payment_service {
        server payment-service:8084;
        keepalive 16;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    # ─── rate limiting zones ────────────────────────────────────────────────────
    # 10 MB shared zone ~ 160 000 unique IPs
    limit_req_zone $binary_remote_addr zone=global:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;

    # ─── main server block ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── health check endpoint (no auth needed) ──────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        # ── Auth Service ─────────────────────────────────────────────────────
        location /api/auth {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Product Service ───────────────────────────────────────────────────
        location /api/products {
            limit_req zone=global burst=20 nodelay;

            proxy_pass         http://product_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Order Service ─────────────────────────────────────────────────────
        location /api/orders {
            limit_req zone=global burst=10 nodelay;

            proxy_pass         http://order_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;   # orders may take longer (Kafka async)
        }

        # ── Payment Service ───────────────────────────────────────────────────
        location /api/payments {
            # deny all;

            limit_req zone=global burst=5 nodelay;

            proxy_pass         http://payment_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Actuator (internal monitoring only) ───────────────────────────────
        location ~ ^/actuator {
            allow 172.16.0.0/12;   # Docker bridge network
            allow 10.0.0.0/8;
            deny  all;
        }

        # ── Frontend (SPA) ────────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── error pages ───────────────────────────────────────────────────────
        error_page 502 503 504 @service_down;
        location @service_down {
            return 503 '{"error":"Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
