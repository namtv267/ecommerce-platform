name: ecommerce

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-1234}
  DB_USER: shop
  DB_PASSWORD: shop

services:
  # ---------------- hạ tầng ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: shop
      CLICKHOUSE_USER: shop
      CLICKHOUSE_PASSWORD: shop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------- services ----------------

  # API Gateway – single entry point on port 80
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service
      - frontend
    restart: unless-stopped

  # Frontend UI – React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - auth-service
      - product-service
      - order-service

  auth-service:
    build: { context: ., args: { SERVICE: auth-service } }
    ports: ["8081:8081"]
    environment:
      <<: *app-env
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  product-service:
    build: { context: ., args: { SERVICE: product-service } }
    ports: ["8082:8082"]
    environment:
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/shop?compress=0
      CLICKHOUSE_USER: shop
      CLICKHOUSE_PASSWORD: shop
    depends_on:
      clickhouse: { condition: service_healthy }

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    ports: ["8083:8083"]
    environment:
      <<: *app-env
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:19092
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_started }

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    ports: ["8084:8084"]
    environment:
      <<: *app-env
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  postgres-data:
  clickhouse-data:
